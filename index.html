<!DOCTYPE html>
<html>
    <head>
        <script type="module" src="./script.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">

        <title>CityTab</title>
    </head>

    <body>
       
        <div class="bookmarks">
            <a href="https://www.youtube.com/" target="_blank">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT20c0xuqIZApunuKIYLzvjvD6Zf13HiV-JLSkErhccLg&s=10" style="height: 55px; border-radius: 20px;">
            </a>
            <a href="https://stardance.hackclub.com/" target="_blank">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKf1ZwR3MbWmQQ_m8aobo3x4CZnYcHUeTW0_BWshb7-g&s" style="height: 55px; border-radius: 20px;">
            </a>
            <a href="https://github.com/" target="_blank">
                <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSS7gME06ln7Wb6cFIZayFk9C00QkhyjQJr1Eqqj3N5_Q&s=10" style="height: 55px; border-radius: 20px;">
            </a>
            <a href="https://slack.com/" target="_blank">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6xbrbBttDkmewr22dLmq-lHCXAwgLZ5xx4LVTnseMyQ&s=10" style="height: 55px; border-radius: 20px;">
            </a>
        </div>

        <div class="clock">
            <span id="hours">00</span>
            <span>:</span>
            <span id="minutes">00</span>
        </div>

        
        <form action="https://www.google.com/search" method="get" target="_blank" class="search-bar">
            <input id="input" type="text" placeholder="search here!" name="q">
            <button type="submit" class="material-icons">search</button>
        </form>

        <div class="topbar">
            <div style="display: flex; align-items: center; margin-left: 10px;">
                <img src="https://cdn.creazilla.com/icons/3235326/grey-settings-icon-lg.png" class="settings" id="settings">
                <p class="name">Hello, _____</p>
            </div>
            
            <!--music player display-->
            <div class="carousel">
                <div class="group">
                    <div class="card">♪ Now playing ♪:</div>
                    <div class="card" id="song">Midnight Pretenders</div>
                    <div class="card"> by </div>
                    <div class="card" id="artist">Tomoko Aran</div>
                </div>
            </div>
        </div>
        
        <div class="weather" style="color: aliceblue;">
            <h2>Weather</h2>
            <h1 id="temperature"></h1>
            <p id="location"></p>
        </div>







    </body>


</html>
